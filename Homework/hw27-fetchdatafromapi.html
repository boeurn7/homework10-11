<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework</title>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body>
  <div lass="max-w-7xl mx-auto mt-12 px-6">
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg  p-6">
      <h3 class="text-xl font-semibold mb-6">Dashboard</h3>
      <div
        class="flex items-center justify-between flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 pb-4 bg-white dark:bg-gray-900 p-20">
        <div>
          <!-- Modal toggle -->
          <button onclick="openModal()"
            class="block mb-4 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
            type="button">
            New Product
          </button>

          <!-- <button id="dropdownActionButton" data-dropdown-toggle="dropdownAction" class="inline-flex items-center text-gray-600 bg-white border border-gray-300
         hover:bg-gray-100 focus:ring-4 focus:ring-gray-100
         font-medium rounded-lg text-sm px-3 py-1.5" type="button">
            Action
            <svg class="w-2.5 h-2.5 ms-2.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 4 4 4-4" />
            </svg>
          </button> -->

          <!-- Dropdown menu -->
          <div id="dropdownAction" class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44">
            <ul class="py-1 text-sm text-gray-700">
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Reward</a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Promote</a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Activate account</a>
              </li>
            </ul>
            <div class="py-1">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                Delete User
              </a>
            </div>
          </div>
        </div>


        <div class="flex gap-4">
          <!-- FILTER DROPDOWN -->
          <div>
            <!-- <label for="categorySelect" class="">Filter by Category:</label> -->
            <select id="categorySelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
           focus:ring-primary-600 focus:border-primary-600 block w-60 p-2.5 
           dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
           dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
              <option value="all">All</option>
            </select>
          </div>
          <label for="table-search" class="sr-only">Search</label>
          <div class="relative">
            <div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
              </svg>
            </div>
            <input type="text" class="block p-2.5 ps-10 text-sm text-gray-900 border border-gray-300
         rounded-lg w-80 bg-gray-50
         focus:ring-blue-500 focus:border-blue-500" placeholder="Search by title..." onkeyup="searchProducts()">
          </div>
        </div>

      </div>


      <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
          <tr>
            <th class="px-6 py-3">ID</th>
            <th class="px-6 py-3">Title</th>
            <th class="px-6 py-3">Description</th>
            <th class="px-6 py-3">Category</th>
            <th class="px-6 py-3">Price</th>
            <th class="px-6 py-3">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Product data will be populated here -->
        </tbody>
      </table>

      <!-- Pagination -->
      <nav class="flex items-center justify-between p-4" aria-label="Table navigation">
        <span class="text-sm text-gray-500">
          Showing <span class="font-semibold">21</span>–<span class="font-semibold">30</span>
        </span>
        <ul class="inline-flex items-center -space-x-px">
          <li>
            <button class="px-3 py-2 ml-0 leading-tight border rounded-l-lg hover:bg-gray-100">
              Previous
            </button>
          </li>
          <li>
            <button class="px-3 py-2 border hover:bg-gray-100">
              1
            </button>
          </li>
          <li>
            <button class="px-3 py-2 border hover:bg-gray-100">
              2
            </button>
          </li>
          <li>
            <button class="px-3 py-2 border bg-blue-600 text-white">
              3
            </button>
          </li>
          <li>
            <button class="px-3 py-2 border hover:bg-gray-100">
              4
            </button>
          </li>
          <li>
            <button class="px-3 py-2 border hover:bg-gray-100">
              5
            </button>
          </li>
          <li>
            <button class="px-3 py-2 leading-tight border rounded-r-lg hover:bg-gray-100">
              Next
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- Main modal -->
  <div id="crud-modal" tabindex="-1" aria-hidden="true"
    class="hidden fixed inset-0 z-50 flex justify-center items-center overflow-y-auto overflow-x-hidden bg-black/50">
    <div class="relative p-4 w-full max-w-md max-h-full">
      <!-- Modal content -->
      <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
        <!-- Modal header -->
        <div
          class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white>" Create New Product </h3>
            <button type="button"
              class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
              onclick="closeModal()">
              <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
              </svg>
              <span class="sr-only">Close modal</span>
            </button>
        </div>
        <!-- Modal body -->
        <form onsubmit="saveProduct(event)" class="p-4 md:p-5">
          <div class="grid gap-4 mb-4 grid-cols-2">
            <div class="col-span-2">
              <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
              <input type="text" name="title" id="title"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Type product title" required="">
            </div>
            <div class="col-span-2 sm:col-span-1">
              <label for="price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Price</label>
              <input type="number" name="price" id="price"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="$2999" required="">
            </div>

            <div class="col-span-2 sm:col-span-1">
              <label for="category"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category</label>
              <select id="categoryId"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                <option selected="">Select category</option>
                <option value="TV">TV/Monitors</option>
                <option value="PC">PC</option>
                <option value="GA">Gaming/Console</option>
                <option value="PH">Phones</option>
              </select>
            </div>

            <div class="col-span-2">
              <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Product
                Description</label>
              <textarea id="description" rows="4"
                class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="Write product description here"></textarea>
            </div>

            <div class="col-span-2">
              <label for="image" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Image</label>
              <input type="text" name="image" id="image"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Type product image url" required="">
            </div>
          </div>
          <button id="btnAdd" type="submit"
            class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                clip-rule="evenodd"></path>
            </svg>
            Add new product
          </button>
          <button id="btnUpdate" type="submit"
            class="hidden text-white items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
              <path fill-rule="evenodd" d="M5 15a1 1 0 011-1h9a1 1 0 110 2H6a1 1 0 01-1-1z" clip-rule="evenodd" />
            </svg>
            Update Product
          </button>


        </form>
      </div>
    </div>
  </div>


  <script>
    const API_URL = 'https://api.escuelajs.co'; // Base API URL
    const tableBody = document.getElementById('tableBody'); // Table body element

    const title = document.getElementById('title');
    const price = document.getElementById('price');
    const description = document.getElementById('description');
    const categoryId = document.getElementById('categoryId');
    const imageUrl = document.getElementById('image');

    const btnAdd = document.getElementById('btnAdd');
    const btnUpdate = document.getElementById('btnUpdate');

    let currentPage = 1;
    let totalPages = 0;
    let isEditProduct;

    const productPagination = {
      limit: 10,
      offset: 0,
    };

    // Function to get total number of products
    const getTotalProducts = async () => {
      try {
        const res = await fetch(`${API_URL}/api/v1/products`);
        const products = await res.json();
        return products.length;
      } catch (error) {
        console.error('Error fetching total products:', error);
        return 0;
      }
    };

    // Function to render pagination buttons
    function renderPagination(totalPages) {
      const paginationContainer = document.querySelector('nav ul');
      paginationContainer.innerHTML = '';

      // Previous button
      const prevButton = document.createElement('li');
      const prevBtn = document.createElement('button');
      prevBtn.textContent = "Previous";
      prevBtn.className = "px-3 py-2 ml-0 leading-tight border rounded-l-lg hover:bg-gray-100";
      prevBtn.addEventListener('click', () => changePage('Previous'));
      prevButton.appendChild(prevBtn);
      paginationContainer.appendChild(prevButton);

      // Page number buttons
      for (let i = 1; i <= totalPages; i++) {
        const pageButton = document.createElement('li');
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = `px-3 py-2 border hover:bg-gray-100 ${i === currentPage ? 'bg-blue-600 text-white' : ''}`;
        btn.addEventListener('click', () => changePage(i));
        pageButton.appendChild(btn);
        paginationContainer.appendChild(pageButton);
      }

      // Next button
      const nextButton = document.createElement('li');
      const nextBtn = document.createElement('button');
      nextBtn.textContent = "Next";
      nextBtn.className = "px-3 py-2 leading-tight border rounded-r-lg hover:bg-gray-100";
      nextBtn.addEventListener('click', () => changePage('Next'));
      nextButton.appendChild(nextBtn);
      paginationContainer.appendChild(nextButton);
    }

    // Function to change page
    function changePage(action) {
      if (action === 'Previous' && currentPage > 1) {
        currentPage--;
      } else if (action === 'Next' && currentPage < totalPages) {
        currentPage++;
      } else if (!isNaN(action)) {
        currentPage = action;
      }
      productPagination.offset = (currentPage - 1) * productPagination.limit;
      getProducts();
      renderPagination(totalPages);
    }

    // Pagination button event listeners
    document.querySelectorAll('nav ul li button').forEach(button => {
      button.addEventListener('click', (e) => {
        const pageNum = e.target.textContent.trim();

        if (pageNum === 'Previous' && productPagination.offset > 0) {
          productPagination.offset -= productPagination.limit;
        } else if (pageNum === 'Next') {
          productPagination.offset += productPagination.limit;
        } else {
          const page = parseInt(pageNum);
          productPagination.offset = (page - 1) * productPagination.limit;
        }
        getProducts();
      });
    });

    // Function to update pagination UI
    function updatePaginationUI(count) {
      const start = productPagination.offset + 1;
      const end = productPagination.offset + count;
      document.querySelector('nav span').innerHTML = `Showing <span class="font-semibold">${start}</span>–<span class="font-semibold">${end}</span>`;
    }

    // Initialize pagination
    async function initPagination() {
      const totalProducts = await getTotalProducts();
      totalPages = Math.ceil(totalProducts / productPagination.limit);

      getProducts();
      renderPagination(totalPages);
    }
    initPagination();

    // Function to search products
    const searchProducts = async () => {
      const searchInput = document.querySelector('input[placeholder="Search by title..."]');
      const userSearch = searchInput.value.trim().toLowerCase();
      console.log("User Search:", userSearch);

      if (!userSearch) {
        getProducts(); // reload all products if search is empty
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/v1/products?title=${encodeURIComponent(userSearch)}&offset=0&limit=${productPagination.limit} `);
        const result = await response.json();
        console.log('Search result:', result);

        renderProducts(result);
        updatePaginationUI(result.length); // Update pagination display
        console.log("Product length after search:", result.length);
      } catch (error) {
        console.error('Error during search:', error);
      }
    };

    // Function to delete a product by ID
    const deleteProduct = async (productId) => {
      try {
        const response = await fetch(`${API_URL}/api/v1/products/${productId}`, {
          method: 'DELETE',
        });
        const data = await response.json();
        // console.log('Delete response data:', data);

        if (response.ok) {
          console.log(`Product with ID ${productId} deleted successfully.`);
        } else {
          console.error(`Failed to delete product with ID ${productId}.`);
        }
        getProducts(); // Refresh the product list after deletion
      } catch (error) {
        console.error('Error deleting product:', error);
      }
    };

    function saveProduct(event) {
      if (isEditProduct) {
        updateProduct(isEditProduct); // Update existing product
      } else {
        createProduct(event); // Create new product
      }
    }

    // Function to update a product by ID
    const updateProduct = async (event) => {
      event.preventDefault();
      try {
        const payload = {
          title: title.value,
          price: Number(price.value),
          description: description.value,
          categoryId: Number(categoryId.value),
          images: [imageUrl.value],
        };
        console.log('Payload', payload);

        const res = await fetch(`${API_URL}/api/v1/products/${isEditProduct}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        console.log('Response', data);

        event.target.reset();
        getProducts();
        closeModal();
      } catch (error) {
        console.log('API ERROR:', error);
      }
    };

    // Function to load categories into the filter dropdown
    async function LoadCategories() {
      const categorySelect = document.getElementById('categorySelect');

      try {
        const res = await fetch(`${API_URL}/api/v1/categories`);
        const categories = await res.json();

        categories.forEach(category => {
          const option = document.createElement('option');
          option.value = category.id;
          option.textContent = category.name;
          categorySelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error fetching categories:', error);
      }
    }

    // Event listener for category filter
    document.getElementById('categorySelect').addEventListener('change', async (event) => {
      const selectedCategory = event.target.value;
      console.log('Selected category:', selectedCategory);

      try {
        let url = `${API_URL}/api/v1/products?offset=0&limit=${productPagination.limit}`;
        if (selectedCategory !== 'all') {
          url = `${API_URL}/api/v1/products?categoryId=${selectedCategory}&offset=0&limit=${productPagination.limit}`;
        }

        const response = await fetch(url);
        const data = await response.json();
        console.log('Filtered products data:', data);

        renderProducts(data);
        updatePaginationUI(data.length); // Update pagination display
      } catch (error) {
        console.error('Error fetching filtered products:', error);
      }
    });

    LoadCategories();

    // Function to get all categories
    const getAllCategories = async () => {
      try {
        const res = await fetch(`${API_URL}/api/v1/categories`);
        const categories = await res.json();
        console.log('Categories:', categories);

        categoryId.innerHTML = '<option value="" disabled selected>Select a category</option>';
        categories.forEach(category => {
          categoryId.innerHTML += `<option value="${category.id}">${category.name}</option>`;
        });
      } catch (error) {
        console.error('Error fetching categories:', error);
      }
    };
    getAllCategories();

    // Function to get product by ID and populate the form
    const getProductById = async (productId) => {
      try {
        const res = await fetch(`${API_URL}/api/v1/products/${productId}`);
        const product = await res.json();

        title.value = product.title;
        price.value = product.price;
        categoryId.value = product.category.id;
        description.value = product.description;
        imageUrl.value = product.images[0];
      } catch (error) {
        console.log("API ERROR", error);
      }
    };

    // Function to create a new product
    const createProduct = async (event) => {
      event.preventDefault();
      try {
        const payload = {
          title: title.value,
          price: price.value,
          description: description.value,
          categoryId: Number(categoryId.value),
          images: [imageUrl.value],
        };
        console.log('Payload', payload);

        const res = await fetch(`${API_URL}/api/v1/products`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        console.log('Response', data);

        event.target.reset();
        getProducts();
        closeModal();
      } catch (error) {
        console.log('API ERROR:', error);
      }
    };

    // Function to render product data into the table 
    const renderProducts = (products) => {
      tableBody.innerHTML = "";
      products.forEach(product => {
        tableBody.innerHTML += `
          <tr class="bg-white border-b hover:bg-gray-50">
          <td class="px-6 py-4">${product.id}</td>
          <td class="px-6 py-4 font-medium text-gray-900">${product.title}</td>
          <td class="px-6 py-4 truncate max-w-xs">${product.description}</td>
          <td><span class="bg-blue-100 text-blue-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded-sm">${product.category.name}</span></td>
          <td class="px-6 py-4 font-bold">$${product.price}</td>
          <td class="px-6 py-4 flex gap-2">
            <button onclick="getProductById(${product.id}); openModal(); changeUpdateButtonState(true)" class="px-4 py-1 text-white bg-blue-500 hover:bg-blue-800 rounded">Edit</button>
            <button class="px-2 py-1 text-white bg-red-500 hover:bg-red-800 rounded" onclick="deleteProduct(${product.id})">Delete</button>
          </td>
          </tr>
        `;
      });
    };

    // Function to fetch product data from API
    async function getProducts() {
      try {
        const response = await fetch(`${API_URL}/api/v1/products?offset=${productPagination.offset}&limit=${productPagination.limit}`);
        // const response = await fetch(`${API_URL}/api/v1/products?offset=0&limit=10`);
        // console.log('Response object:', response);

        const data = await response.json();
        // console.log("Products data", JSON.stringify(data, null, 2));
        // console.log('Products data:', data);

        console.log("Product length", data.length);

        renderProducts(data);
        updatePaginationUI(data.length); // Update pagination display
      } catch (error) {
        console.error('Error fetching products:', error);
      }
    }
    getProducts();

    const closeModal = () => {
      const modal = document.getElementById('crud-modal');
      modal.classList.add('hidden');
    };

    const openModal = () => {
      const modal = document.getElementById('crud-modal');
      modal.classList.remove('hidden');
    };

    function changeUpdateButtonState(isEdit) {
      if (isEdit) {
        btnAdd.style.display = 'none';
        btnUpdate.style.display = 'inline-flex';
      } else {
        btnAdd.style.display = 'inline-flex';
        btnUpdate.style.display = 'none';
      }
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.js"></script>

</body>

</html>
